name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy matplotlib akshare pyinstaller

    - name: Build Windows EXE
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "MultiStrategy" ^
          --add-data "path_manager.py;." ^
          --add-data "init_data_path.py;." ^
          --add-data "data_updater.py;." ^
          --add-data "weekend_data_updater.py;." ^
          --add-data "strategy_if300.py;." ^
          --add-data "strategy_weekend.py;." ^
          --add-data "data;data" ^
          signal_app_main.py

        echo "Build completed!"
      shell: cmd

    - name: Copy data files (Windows)
      run: |
        # 使用 PowerShell 的 Copy-Item 来处理中文路径
        if (Test-Path "data") {
          Copy-Item -Path "data" -Destination "dist\MultiStrategy\data" -Recurse -Force
          Write-Host "Data directory copied successfully"
        } else {
          Write-Host "Warning: data directory not found"
        }
      shell: pwsh

    - name: Create release zip (Windows)
      run: |
        cd dist
        # 使用 PowerShell Compress-Archive 创建压缩包
        Compress-Archive -Path "MultiStrategy" -DestinationPath "MultiStrategy-Windows.zip" -Force
        Write-Host "Zip file created successfully"
        cd ..
      shell: pwsh

    - name: Upload artifact (Directory version)
      uses: actions/upload-artifact@v4
      with:
        name: IF300-Signal-Windows
        path: dist/MultiStrategy/
        retention-days: 30

    - name: Upload artifact (Zip version)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: IF300-Signal-Windows-Zip
        path: dist/MultiStrategy-Windows.zip
        retention-days: 30
